name: reservoir-inspection

services:
  db:
    image: postgres:16-alpine
    container_name: reservoir-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservoir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservoir}
      POSTGRES_DB: ${POSTGRES_DB:-reservoir}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-reservoir} -d ${POSTGRES_DB:-reservoir}
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: reservoir-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reservoir}:${POSTGRES_PASSWORD:-reservoir}@db:5432/${POSTGRES_DB:-reservoir}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: reservoir-frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pg_data:

